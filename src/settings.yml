---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor: ''
polling_url: '{%- assign wc_lat = lat_lon | split: "," | first | strip -%}{%- assign wc_lon = lat_lon | split: "," | last | strip -%}{%- assign wc_tz = trmnl.user.time_zone_iana | default: "Europe/Berlin" | url_encode -%}{%- assign wc_src = data_source | default: "auto" | downcase -%}{%- if wc_src != "dwd" and wc_src != "open-meteo" -%}{%- assign wc_la = wc_lat | plus: 0 -%}{%- assign wc_lo = wc_lon | plus: 0 -%}{%- if wc_la >= 34 and wc_la <= 72 and wc_lo >= -11 and wc_lo <= 26 -%}{%- assign wc_src = "dwd" -%}{%- else -%}{%- assign wc_src = "open-meteo" -%}{%- endif -%}{%- endif -%}{%- if wc_src == "dwd" -%}https://api.brightsky.dev/weather?lat={{ wc_lat }}&lon={{ wc_lon }}&tz={{ wc_tz }}&date={{ "now" | date: "%Y-%m-%d" }}&last_date={{ "now" | date: "%s" | plus: 691200 | date: "%Y-%m-%d" }}{%- else -%}https://api.open-meteo.com/v1/forecast?latitude={{ wc_lat }}&longitude={{ wc_lon }}&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day&current=temperature_2m,weather_code,is_day&timezone={{ wc_tz }}&forecast_days=8{%- endif -%}'
polling_headers: ''
polling_body: ''
id: 500572
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  description: Search for a city or postal code, or enter coordinates as "lat,lon".
  description-de: Ort oder Postleitzahl suchen, oder Koordinaten als "lat,lon" eingeben.
  default: 52.5200,13.4050
- keyname: location_name
  field_type: string
  name: Display name
  description: Title shown on the screen. Leave empty to show the name of the nearest DWD forecast station, if the DWD is the data source.
  description-de: Titel auf dem Bildschirm. Leer lassen, um den Namen der nächsten DWD-Vorhersagestation anzuzeigen, wenn der DWD die Datenquelle ist.
  placeholder: Berlin
  optional: true
- keyname: language
  field_type: select
  name: Language
  description: Auto follows the language of your TRMNL account.
  description-de: Auto folgt der Sprache deines TRMNL-Kontos.
  options:
  - Auto: auto
  - Deutsch: de
  - English: en
  default: auto
- keyname: units
  field_type: select
  name: Temperature unit
  description: Fahrenheit also switches the clock to 12-hour time.
  description-de: Fahrenheit stellt auch die Uhrzeit auf 12 Stunden um.
  options:
  - Celsius: celsius
  - Fahrenheit: fahrenheit
  default: celsius
- keyname: data_source
  field_type: select
  name: Data source
  description: Auto uses the DWD in Europe and Open-Meteo everywhere else. The DWD has no rain forecast for most stations outside Europe.
  description-de: Auto nutzt in Europa den DWD und sonst Open-Meteo. Außerhalb Europas hat der DWD für die meisten Stationen keine Regenvorhersage.
  options:
  - Auto: auto
  - DWD: dwd
  - Open-Meteo: open-meteo
  default: auto
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: environment,life
  github_url: https://github.com/samumatic/trmnl-weather-curve
  description: 'Weather Curve displays the week ahead as a single, clear chart showing a temperature curve for daily highs and lows, a weather icon for each day and the likelihood of rain as a shaded area at the bottom. On the left, you can see the current temperature, today''s high and low temperatures, and the chance of rain, as well as a short outlook for tomorrow. The design is optimised for e-paper displays, featuring large text, crisp lines and a dot pattern instead of grey for monochrome screens.<br><br>In Europe the forecast comes from the Deutscher Wetterdienst (DWD), Germany''s national meteorological service, via the free Bright Sky API. Elsewhere it comes from Open-Meteo, as the DWD has no rain forecast for most stations outside Europe. Both are free and need no account or API key. By default the plugin picks the source by your location; you can also choose one. The DWD source uses the closest DWD station to your location, and the plugin updates hourly.<br><br>You can search for your location or enter coordinates, give it a custom display name, select either German or English (or the language of your account) and switch between Celsius and Fahrenheit.<br><br>Weather Curve is open source. Feedback, bug reports and ideas are welcome on <a href="https://github.com/samumatic/trmnl-weather-curve" class="underline" target="_blank">GitHub</a>.<br><br>Data: Deutscher Wetterdienst (CC BY 4.0) via Bright Sky, and <a href="https://open-meteo.com/" class="underline" target="_blank">Weather data by Open-Meteo.com</a> (CC BY 4.0). We are not affiliated with or endorsed by the DWD or Open-Meteo.'
name: Weather Curve (DWD)
description: Temperature curve & rain, 7 days
refresh_interval: 60
